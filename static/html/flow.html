<!DOCTYPE html>
<html lang="zh-CN" class="is-mobile-preview">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
	<title>流程图</title>
	<link rel="stylesheet" href="./mldong-flow-designer-dingtalk.css" />
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: #f5f6fa;
			overflow: hidden;
		}
		#app {
			width: 100%;
			height: 100%;
		}
		.error-tip {
			padding: 16px;
			color: #ef4444;
			font-size: 13px;
			font-family: system-ui, sans-serif;
		}
	</style>
</head>
<body>
	<div id="app"></div>
	<script>
		// uni-app x webview 会注入 module/exports，截胡 UMD 挂载；先清掉再加载脚本
		try { delete window.module; } catch (e) {}
		try { delete window.exports; } catch (e) {}
		try { delete window.define; } catch (e) {}
	</script>
	<script src="./vue.global.prod.js"></script>
	<script>
		// 设计器 UMD 读的是 global.vue（小写）
		window.vue = window.Vue;
		try { delete window.module; } catch (e) {}
		try { delete window.exports; } catch (e) {}
		try { delete window.define; } catch (e) {}
	</script>
	<script src="./mldong-flow-designer-dingtalk.umd.cjs"></script>
	<script>
		(function () {
			var Vue = window.Vue;
			var FlowDesigner = window.MldongFlowDesignerDingtalk;
			var state = null;
			var app = null;

			function ensureReady() {
				if (!Vue || !FlowDesigner) {
					document.getElementById('app').innerHTML =
						'<div class="error-tip">流程设计器加载失败（Vue / mldong-flow-designer-dingtalk）</div>';
					return false;
				}
				return true;
			}

			/**
			 * 对齐 vben：整份 highLight 透传（含 nodeProgress 成员进度）
			 * payload: { graph, highLight } 或兼容旧字段 activeNames/historyNames/historyEdges
			 */
			function buildHighLight(payload) {
				var hl = payload.highLight;
				if (hl && typeof hl === 'object') {
					return {
						activeNodeNames: hl.activeNodeNames || [],
						historyNodeNames: hl.historyNodeNames || [],
						historyEdgeNames: hl.historyEdgeNames || [],
						nodeProgress: hl.nodeProgress || undefined
					};
				}
				return {
					activeNodeNames: payload.activeNames || [],
					historyNodeNames: payload.historyNames || [],
					historyEdgeNames: payload.historyEdges || []
				};
			}

			window.renderFlow = function (input) {
				if (!ensureReady()) return;
				var payload = null;
				try {
					payload = typeof input === 'string' ? JSON.parse(input) : input;
				} catch (e) {
					payload = null;
				}
				if (!payload) {
					document.getElementById('app').innerHTML = '<div class="error-tip">流程图数据解析失败</div>';
					return;
				}

				var graph = payload.graph || {};
				var highLight = buildHighLight(payload);

				if (!state) {
					state = Vue.reactive({
						graph: graph,
						highLight: highLight
					});
					app = Vue.createApp({
						setup: function () {
							return function () {
								return Vue.h(FlowDesigner, {
									value: state.graph,
									highLight: state.highLight,
									viewer: true,
									initDndPanel: false,
									initControl: true
								});
							};
						}
					});
					app.mount('#app');
				} else {
					state.graph = graph;
					state.highLight = highLight;
				}
			};

			if (window.__flowPayload) {
				try { window.renderFlow(window.__flowPayload); } catch (e) { console.error(e); }
			}
		})();
	</script>
</body>
</html>
